<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">BFBT 三层报告体验</title>
  <desc id="desc">使用 BFBT 报告配色展示 Quick Research、Fast Matrix 和 Event 引擎三类报告界面，不包含任何策略结果。</desc>
  <rect width="1200" height="940" fill="#ffffff"/>

  <g font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC',sans-serif">
    <text x="50" y="48" fill="#1b2722" font-size="28" font-weight="750">通过三类报告探索 BFBT</text>
    <text x="50" y="75" fill="#68776f" font-size="14">每层回答不同的问题；本图只展示报告界面，不包含任何策略结果。</text>

    <!-- Quick Research -->
    <g>
      <rect x="50" y="105" width="1100" height="230" rx="14" fill="#ffffff" stroke="#d3ddd7" stroke-width="2"/>
      <path d="M64 105H310V335H64Q50 335 50 321V119Q50 105 64 105Z" fill="#edf3ef"/>
      <text x="78" y="143" fill="#238c72" font-size="12" font-weight="800" letter-spacing="1.4">01 · 因子诊断</text>
      <text x="78" y="182" fill="#1b2722" font-size="24" font-weight="750">Quick Research</text>
      <text x="78" y="215" fill="#68776f" font-size="14">因子的截面排序是否包含</text>
      <text x="78" y="236" fill="#68776f" font-size="14">值得继续研究的信息？</text>
      <text x="78" y="296" fill="#276f5e" font-size="13" font-weight="700">不模拟账户</text>

      <text x="342" y="139" fill="#1b2722" font-size="19" font-weight="700">Quick Research 报告</text>
      <text x="342" y="161" fill="#68776f" font-size="12">比较因子、区间、预测周期、覆盖率与换手</text>
      <g>
        <rect x="342" y="181" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="357" y="202" fill="#68776f" font-size="11">Rank IC</text><rect x="357" y="214" width="91" height="7" rx="3.5" fill="#238c72"/>
        <rect x="506" y="181" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="521" y="202" fill="#68776f" font-size="11">覆盖率</text><rect x="521" y="214" width="112" height="7" rx="3.5" fill="#3f709f"/>
        <rect x="670" y="181" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="685" y="202" fill="#68776f" font-size="11">换手</text><rect x="685" y="214" width="64" height="7" rx="3.5" fill="#cb8930"/>
      </g>
      <rect x="342" y="251" width="478" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
      <line x1="360" y1="291" x2="800" y2="291" stroke="#d3ddd7"/>
      <g fill="#238c72"><rect x="390" y="274" width="42" height="17"/><rect x="462" y="263" width="42" height="28"/><rect x="534" y="251" width="42" height="40"/><rect x="606" y="260" width="42" height="31"/><rect x="678" y="268" width="42" height="23"/></g>
      <text x="360" y="270" fill="#68776f" font-size="10">分层表现</text>
      <rect x="844" y="181" width="270" height="125" rx="9" fill="#ffffff" stroke="#d3ddd7"/>
      <rect x="844" y="181" width="270" height="29" rx="9" fill="#edf3ef"/>
      <text x="860" y="200" fill="#68776f" font-size="10" font-weight="700">因子</text><text x="1000" y="200" fill="#68776f" font-size="10" font-weight="700">区间</text>
      <g stroke="#e3e9e5"><line x1="844" y1="235" x2="1114" y2="235"/><line x1="844" y1="260" x2="1114" y2="260"/><line x1="844" y1="285" x2="1114" y2="285"/></g>
      <g fill="#cbd5d0"><rect x="860" y="220" width="88" height="7" rx="3"/><rect x="1000" y="220" width="69" height="7" rx="3"/><rect x="860" y="245" width="104" height="7" rx="3"/><rect x="1000" y="245" width="52" height="7" rx="3"/><rect x="860" y="270" width="76" height="7" rx="3"/><rect x="1000" y="270" width="82" height="7" rx="3"/></g>
    </g>

    <!-- Fast Matrix -->
    <g>
      <rect x="50" y="360" width="1100" height="230" rx="14" fill="#ffffff" stroke="#d3ddd7" stroke-width="2"/>
      <path d="M64 360H310V590H64Q50 590 50 576V374Q50 360 64 360Z" fill="#edf3ef"/>
      <text x="78" y="398" fill="#238c72" font-size="12" font-weight="800" letter-spacing="1.4">02 · 组合研究</text>
      <text x="78" y="437" fill="#1b2722" font-size="24" font-weight="750">Fast Matrix</text>
      <text x="78" y="470" fill="#68776f" font-size="14">组合在计入成本和换手后</text>
      <text x="78" y="491" fill="#68776f" font-size="14">表现如何？</text>
      <text x="78" y="551" fill="#276f5e" font-size="13" font-weight="700">研究结果 · 用户筛选</text>

      <text x="342" y="394" fill="#1b2722" font-size="19" font-weight="700">Fast Matrix 报告</text>
      <text x="342" y="416" fill="#68776f" font-size="12">比较组合路径、成本、资金费、敞口和估值</text>
      <g>
        <rect x="342" y="436" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="357" y="457" fill="#68776f" font-size="11">扣除成本后收益</text><rect x="357" y="469" width="84" height="7" rx="3.5" fill="#238c72"/>
        <rect x="506" y="436" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="521" y="457" fill="#68776f" font-size="11">成本拖累</text><rect x="521" y="469" width="58" height="7" rx="3.5" fill="#cb8930"/>
        <rect x="670" y="436" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="685" y="457" fill="#68776f" font-size="11">敞口</text><rect x="685" y="469" width="104" height="7" rx="3.5" fill="#3f709f"/>
      </g>
      <rect x="342" y="506" width="478" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
      <line x1="360" y1="548" x2="800" y2="548" stroke="#d3ddd7"/>
      <polyline points="360,542 405,537 450,540 495,526 540,531 585,516 630,519 675,505 720,511 760,497 800,501" fill="none" stroke="#238c72" stroke-width="2.5"/>
      <text x="360" y="525" fill="#68776f" font-size="10">组合路径</text>
      <rect x="844" y="436" width="270" height="125" rx="9" fill="#ffffff" stroke="#d3ddd7"/>
      <rect x="844" y="436" width="270" height="29" rx="9" fill="#edf3ef"/>
      <text x="860" y="455" fill="#68776f" font-size="10" font-weight="700">研究 RUN</text><text x="1020" y="455" fill="#68776f" font-size="10" font-weight="700">状态</text>
      <g stroke="#e3e9e5"><line x1="844" y1="490" x2="1114" y2="490"/><line x1="844" y1="515" x2="1114" y2="515"/><line x1="844" y1="540" x2="1114" y2="540"/></g>
      <g fill="#cbd5d0"><rect x="860" y="475" width="112" height="7" rx="3"/><rect x="1020" y="475" width="55" height="7" rx="3"/><rect x="860" y="500" width="91" height="7" rx="3"/><rect x="1020" y="500" width="68" height="7" rx="3"/><rect x="860" y="525" width="124" height="7" rx="3"/><rect x="1020" y="525" width="47" height="7" rx="3"/></g>
    </g>

    <!-- Event Engine -->
    <g>
      <rect x="50" y="615" width="1100" height="230" rx="14" fill="#ffffff" stroke="#d3ddd7" stroke-width="2"/>
      <path d="M64 615H310V845H64Q50 845 50 831V629Q50 615 64 615Z" fill="#e0f1ea"/>
      <text x="78" y="653" fill="#238c72" font-size="12" font-weight="800" letter-spacing="1.4">03 · 正式回测</text>
      <text x="78" y="692" fill="#1b2722" font-size="24" font-weight="750">Event 引擎</text>
      <text x="78" y="725" fill="#68776f" font-size="14">成交、持仓、保证金和风险事件</text>
      <text x="78" y="746" fill="#68776f" font-size="14">如何随时间发生？</text>
      <text x="78" y="806" fill="#276f5e" font-size="13" font-weight="700">正式结果 · 完整审计</text>

      <text x="342" y="649" fill="#1b2722" font-size="19" font-weight="700">Event 引擎报告</text>
      <text x="342" y="671" fill="#68776f" font-size="12">从收益追溯到精确成交、持仓、风险事件和身份</text>
      <g>
        <rect x="342" y="691" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="357" y="712" fill="#68776f" font-size="11">总收益</text><rect x="357" y="724" width="90" height="7" rx="3.5" fill="#238c72"/>
        <rect x="506" y="691" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="521" y="712" fill="#68776f" font-size="11">最大回撤</text><rect x="521" y="724" width="67" height="7" rx="3.5" fill="#cb8930"/>
        <rect x="670" y="691" width="150" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
        <text x="685" y="712" fill="#68776f" font-size="11">成交与风险事件</text><rect x="685" y="724" width="108" height="7" rx="3.5" fill="#3f709f"/>
      </g>
      <rect x="342" y="761" width="478" height="55" rx="9" fill="#f7f9f7" stroke="#e3e9e5"/>
      <line x1="360" y1="803" x2="800" y2="803" stroke="#d3ddd7"/>
      <polyline points="360,797 404,793 448,798 492,780 536,786 580,772 624,781 668,763 712,770 756,754 800,760" fill="none" stroke="#238c72" stroke-width="2.5"/>
      <g fill="#cb8930" stroke="#ffffff" stroke-width="1.5"><circle cx="492" cy="780" r="4"/><circle cx="624" cy="781" r="4"/><circle cx="756" cy="754" r="4"/></g>
      <text x="360" y="780" fill="#68776f" font-size="10">净值与事件导航</text>
      <rect x="844" y="691" width="270" height="125" rx="9" fill="#ffffff" stroke="#d3ddd7"/>
      <rect x="844" y="691" width="270" height="29" rx="9" fill="#edf3ef"/>
      <text x="860" y="710" fill="#68776f" font-size="10" font-weight="700">审计证据</text>
      <g stroke="#e3e9e5"><line x1="844" y1="745" x2="1114" y2="745"/><line x1="844" y1="770" x2="1114" y2="770"/><line x1="844" y1="795" x2="1114" y2="795"/></g>
      <g fill="#68776f" font-size="11"><text x="860" y="738">成交</text><text x="860" y="763">持仓变化</text><text x="860" y="788">风险事件</text><text x="1015" y="738">设置</text><text x="1015" y="763">数据版本</text><text x="1015" y="788">身份指纹</text></g>
    </g>

    <text x="600" y="895" text-anchor="middle" fill="#68776f" font-size="12">示意界面 · 不包含收益数字或策略结论</text>
  </g>
</svg>
