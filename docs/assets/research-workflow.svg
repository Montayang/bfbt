<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">BFBT research workflow</title>
  <desc id="desc">A white-background flowchart from a research idea through semantic freeze, Quick Research, Fast Matrix, human selection, Event V2 formal confirmation, and immutable evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="940" fill="#ffffff"/>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M600 92V130"/>
    <path d="M600 220V262"/>
    <path d="M600 362V404"/>
    <path d="M600 504V544"/>
    <path d="M600 676V716"/>
    <path d="M600 826V864"/>
    <path d="M724 610H905"/>
    <path d="M476 610H238V175H350"/>
  </g>

  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <g filter="url(#soft-shadow)">
      <ellipse cx="600" cy="58" rx="224" ry="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="600" y="64" fill="#172033" font-size="22" font-weight="700">Natural-language research idea</text>
    </g>

    <g filter="url(#soft-shadow)">
      <path d="M370 130H830L850 175L830 220H370L350 175Z" fill="#fff8e8" stroke="#d69e2e" stroke-width="2"/>
      <text x="600" y="166" fill="#7a4b00" font-size="13" font-weight="800" letter-spacing="1.5">SEMANTIC FREEZE</text>
      <text x="600" y="193" fill="#172033" font-size="17" font-weight="620">data · clocks · sizing · costs · risk · identity</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="350" y="262" width="500" height="100" rx="12" fill="#ecfbf7" stroke="#1f9d86" stroke-width="2"/>
      <text x="600" y="302" fill="#087564" font-size="25" font-weight="750">Quick Research</text>
      <text x="600" y="333" fill="#40566a" font-size="16">IC · quantiles · coverage · turnover</text>
      <text x="872" y="315" text-anchor="start" fill="#087564" font-size="12" font-weight="750">NO ACCOUNT SIMULATION</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="350" y="404" width="500" height="100" rx="12" fill="#eef4ff" stroke="#4f7fd5" stroke-width="2"/>
      <text x="600" y="444" fill="#315fae" font-size="25" font-weight="750">Fast Matrix</text>
      <text x="600" y="475" fill="#40566a" font-size="16">target paths · costs · funding · valuation</text>
      <text x="872" y="457" text-anchor="start" fill="#315fae" font-size="12" font-weight="750">RESEARCH ARTIFACT</text>
    </g>

    <g filter="url(#soft-shadow)">
      <path d="M600 544L724 610L600 676L476 610Z" fill="#fff7df" stroke="#d69e2e" stroke-width="2.5"/>
      <text x="600" y="602" fill="#7a4b00" font-size="18" font-weight="750">Human selection</text>
      <text x="600" y="628" fill="#40566a" font-size="14">promote to formal?</text>
    </g>

    <g>
      <text x="658" y="700" fill="#9b3a4b" font-size="12" font-weight="800" letter-spacing="1">PROMOTE</text>
      <text x="837" y="598" fill="#526579" font-size="12" font-weight="800" letter-spacing="1">KEEP AS RESEARCH</text>
      <text x="286" y="590" fill="#9a6700" font-size="12" font-weight="800" letter-spacing="1">REVISE</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="905" y="568" width="230" height="84" rx="42" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="1020" y="603" fill="#334155" font-size="18" font-weight="700">Research result</text>
      <text x="1020" y="628" fill="#64748b" font-size="13">not formal strategy truth</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="344" y="716" width="512" height="110" rx="12" fill="#fff0f2" stroke="#d8586c" stroke-width="3"/>
      <rect x="352" y="724" width="496" height="94" rx="8" fill="none" stroke="#ed9caa" stroke-width="1.5"/>
      <text x="600" y="758" fill="#a82f44" font-size="13" font-weight="800" letter-spacing="1.5">FORMAL CONFIRMATION</text>
      <text x="600" y="790" fill="#172033" font-size="28" font-weight="780">Event / V2</text>
      <text x="600" y="814" fill="#526579" font-size="14">path state · risk arbitration · margin · checkpoint / recovery</text>
    </g>

    <g filter="url(#soft-shadow)">
      <path d="M340 864H860V914H830L810 928H390L370 914H340Z" fill="#edf8f1" stroke="#27845a" stroke-width="2.5"/>
      <text x="600" y="892" fill="#176b46" font-size="18" font-weight="780">Immutable run &amp; audit evidence</text>
      <text x="600" y="916" fill="#526579" font-size="13">data · config · source · fills · positions · risk events · hashes</text>
    </g>
  </g>
</svg>
