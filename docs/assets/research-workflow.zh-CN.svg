<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc">
  <title id="title">BFBT 研究工作流</title>
  <desc id="desc">白底流程图：从自然语言研究想法经过研究口径确认、Quick Research、Fast Matrix、人工选择、Event 引擎正式回测，最终形成可审计证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#68776f"/>
    </marker>
  </defs>

  <rect width="1100" height="920" fill="#ffffff"/>

  <g fill="none" stroke="#68776f" stroke-width="2" marker-end="url(#arrow)">
    <path d="M550 100V145"/>
    <path d="M550 225V260"/>
    <path d="M550 340V375"/>
    <path d="M550 455V500"/>
    <path d="M550 620V665"/>
    <path d="M550 760V805"/>
    <path d="M680 560H835"/>
    <path d="M420 560H150V185H310"/>
  </g>

  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <g>
      <rect x="310" y="30" width="480" height="70" rx="10" fill="#edf3ef" stroke="#d3ddd7" stroke-width="2"/>
      <text x="550" y="72" fill="#1b2722" font-size="21" font-weight="700">自然语言研究想法</text>
    </g>

    <g>
      <rect x="310" y="145" width="480" height="80" rx="10" fill="#f7f9f7" stroke="#d3ddd7" stroke-width="2"/>
      <text x="550" y="178" fill="#1b2722" font-size="21" font-weight="700">确认研究口径</text>
      <text x="550" y="205" fill="#68776f" font-size="14">数据 · 时钟 · 仓位 · 成本 · 风险 · 身份</text>
    </g>

    <g>
      <rect x="310" y="260" width="480" height="80" rx="10" fill="#f7f9f7" stroke="#d3ddd7" stroke-width="2"/>
      <text x="550" y="293" fill="#1b2722" font-size="21" font-weight="700">Quick Research</text>
      <text x="550" y="320" fill="#68776f" font-size="14">IC · 分层 · 覆盖率 · 换手 · 不模拟账户</text>
    </g>

    <g>
      <rect x="310" y="375" width="480" height="80" rx="10" fill="#f7f9f7" stroke="#d3ddd7" stroke-width="2"/>
      <text x="550" y="408" fill="#1b2722" font-size="21" font-weight="700">Fast Matrix</text>
      <text x="550" y="435" fill="#68776f" font-size="14">组合路径 · 成本 · 资金费 · 估值</text>
    </g>

    <g>
      <path d="M550 500L680 560L550 620L420 560Z" fill="#fff8ea" stroke="#cb8930" stroke-width="2"/>
      <text x="550" y="553" fill="#1b2722" font-size="18" font-weight="700">用户人工选择</text>
      <text x="550" y="578" fill="#68776f" font-size="13">是否进入正式回测？</text>
    </g>

    <g fill="#68776f" font-size="12" font-weight="700">
      <text x="730" y="548">保留为研究结果</text>
      <text x="575" y="646" text-anchor="start">进入正式回测</text>
      <text x="177" y="548">修订</text>
    </g>

    <g>
      <rect x="835" y="520" width="225" height="80" rx="10" fill="#f7f9f7" stroke="#d3ddd7" stroke-width="2"/>
      <text x="947.5" y="553" fill="#1b2722" font-size="18" font-weight="700">研究结果</text>
      <text x="947.5" y="578" fill="#68776f" font-size="13">尚未完成正式回测</text>
    </g>

    <g>
      <rect x="310" y="665" width="480" height="95" rx="10" fill="#e0f1ea" stroke="#238c72" stroke-width="2.5"/>
      <text x="550" y="704" fill="#276f5e" font-size="23" font-weight="750">Event 引擎正式回测</text>
      <text x="550" y="734" fill="#68776f" font-size="14">仓位 · 成交 · 风险退出 · 保证金 · 中断恢复</text>
    </g>

    <g>
      <rect x="310" y="805" width="480" height="85" rx="10" fill="#f7f9f7" stroke="#d3ddd7" stroke-width="2"/>
      <text x="550" y="840" fill="#1b2722" font-size="20" font-weight="700">可复现结果与审计证据</text>
      <text x="550" y="867" fill="#68776f" font-size="13">数据版本 · 设置 · 成交 · 持仓 · 风险事件 · 指纹</text>
    </g>
  </g>
</svg>
