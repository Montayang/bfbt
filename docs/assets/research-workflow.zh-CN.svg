<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">BFBT 研究工作流</title>
  <desc id="desc">白底流程图：从研究想法经过语义冻结、快速研究、Fast Matrix、人工选择、Event V2 正式确认，最终形成不可变审计证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="940" fill="#ffffff"/>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M600 92V130"/>
    <path d="M600 220V262"/>
    <path d="M600 362V404"/>
    <path d="M600 504V544"/>
    <path d="M600 676V716"/>
    <path d="M600 826V864"/>
    <path d="M724 610H905"/>
    <path d="M476 610H238V175H350"/>
  </g>

  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <g filter="url(#soft-shadow)">
      <ellipse cx="600" cy="58" rx="224" ry="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="600" y="64" fill="#172033" font-size="22" font-weight="700">自然语言研究想法</text>
    </g>

    <g filter="url(#soft-shadow)">
      <path d="M370 130H830L850 175L830 220H370L350 175Z" fill="#fff8e8" stroke="#d69e2e" stroke-width="2"/>
      <text x="600" y="166" fill="#7a4b00" font-size="13" font-weight="800" letter-spacing="1.5">语义冻结</text>
      <text x="600" y="193" fill="#172033" font-size="17" font-weight="620">数据 · 时钟 · 仓位 · 成本 · 风险 · 身份</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="350" y="262" width="500" height="100" rx="12" fill="#ecfbf7" stroke="#1f9d86" stroke-width="2"/>
      <text x="600" y="302" fill="#087564" font-size="25" font-weight="750">Quick Research</text>
      <text x="600" y="333" fill="#40566a" font-size="16">IC · 分层 · 覆盖率 · 换手</text>
      <text x="872" y="315" text-anchor="start" fill="#087564" font-size="12" font-weight="750">不模拟账户</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="350" y="404" width="500" height="100" rx="12" fill="#eef4ff" stroke="#4f7fd5" stroke-width="2"/>
      <text x="600" y="444" fill="#315fae" font-size="25" font-weight="750">Fast Matrix</text>
      <text x="600" y="475" fill="#40566a" font-size="16">目标路径 · 成本 · 资金费 · 估值</text>
      <text x="872" y="457" text-anchor="start" fill="#315fae" font-size="12" font-weight="750">研究产物</text>
    </g>

    <g filter="url(#soft-shadow)">
      <path d="M600 544L724 610L600 676L476 610Z" fill="#fff7df" stroke="#d69e2e" stroke-width="2.5"/>
      <text x="600" y="602" fill="#7a4b00" font-size="18" font-weight="750">用户人工选择</text>
      <text x="600" y="628" fill="#40566a" font-size="14">是否进入正式确认？</text>
    </g>

    <g>
      <text x="646" y="700" fill="#9b3a4b" font-size="12" font-weight="800" letter-spacing="1">提升</text>
      <text x="837" y="598" fill="#526579" font-size="12" font-weight="800" letter-spacing="1">保留为研究结果</text>
      <text x="276" y="590" fill="#9a6700" font-size="12" font-weight="800" letter-spacing="1">修订</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="905" y="568" width="230" height="84" rx="42" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="1020" y="603" fill="#334155" font-size="18" font-weight="700">研究结果</text>
      <text x="1020" y="628" fill="#64748b" font-size="13">不是正式策略事实</text>
    </g>

    <g filter="url(#soft-shadow)">
      <rect x="344" y="716" width="512" height="110" rx="12" fill="#fff0f2" stroke="#d8586c" stroke-width="3"/>
      <rect x="352" y="724" width="496" height="94" rx="8" fill="none" stroke="#ed9caa" stroke-width="1.5"/>
      <text x="600" y="758" fill="#a82f44" font-size="13" font-weight="800" letter-spacing="1.5">正式确认</text>
      <text x="600" y="790" fill="#172033" font-size="28" font-weight="780">Event / V2</text>
      <text x="600" y="814" fill="#526579" font-size="14">路径状态 · 风险仲裁 · 保证金 · checkpoint / 恢复</text>
    </g>

    <g filter="url(#soft-shadow)">
      <path d="M340 864H860V914H830L810 928H390L370 914H340Z" fill="#edf8f1" stroke="#27845a" stroke-width="2.5"/>
      <text x="600" y="892" fill="#176b46" font-size="18" font-weight="780">不可变 run 与审计证据</text>
      <text x="600" y="916" fill="#526579" font-size="13">数据 · 配置 · 源码 · 成交 · 持仓 · 风险事件 · 哈希</text>
    </g>
  </g>
</svg>
