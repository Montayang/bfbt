name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked environment
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify release contract
        run: |
          python scripts/release_tools.py check-lock
          python scripts/release_tools.py check-tag "${GITHUB_REF_NAME}"
      - name: Compile supported Python syntax
        run: python -m compileall -q src tests scripts
      - name: Offline test suite
        run: python -B -m pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked release environment
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build and verify distributions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/release_tools.py check-tag "${GITHUB_REF_NAME}"
          python -m build --no-isolation
          python -m twine check dist/*
          python scripts/release_tools.py check-dist --version "${VERSION}" --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "BFBT ${GITHUB_REF_NAME#v}" \
            --draft
          gh release edit "${GITHUB_REF_NAME}" --draft=false
