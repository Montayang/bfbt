# 第二版正式配置示例。A18 使用有资源上限的小型 in-memory 全链路。
config_version: v2

run:
  name: null
  start: null
  end: null
  dataset_version: null
  random_seed: 42

schedule:
  factor_interval: 1h
  rebalance_interval: 4h
  signal_delay_bars: 1

capital:
  currency: USDT
  initial_equity: 100000
  margin_model: simple_cross
  reserved_cost_buffer: 500

portfolio:
  selection:
    mode: rank_set
    rank_order: descending
    clock: rebalance
    lag: 1
    long:
      ranks: [1, 3]
      ranges: []
    short:
      ranks: [8]
      ranges:
        - [10, 12]
  sizing:
    mode: fixed_margin
    margin_amount: 1000
    reverse_policy: flatten_then_open
  constraints:
    max_gross_exposure: 2.0
    max_net_exposure: 0.5
    max_symbol_weight: 0.25
    max_symbol_notional: 25000
    max_consecutive_adds: 3
    max_turnover: 1.0

execution:
  fill_price: next_bar_open
  partial_fill: false
  fee:
    model: fixed_bps
    taker_bps: 4.0
    maker_bps: null
  slippage:
    model: fixed_bps
    bps: 2.0
  funding:
    enabled: true
    missing_policy: error

valuation:
  price: mark_close

risk:
  leverage: 2.0
  enforce_liquidation: false
  evaluation_interval: 1m
  trigger_price: trade
  fill_model: next_bar_open
  intrabar_conflict: worst_case
  symbol_exits:
    stop_loss:
      enabled: true
      distance: 0.05
      action: close
    take_profit:
      enabled: true
      distance: 0.10
      action: close
    trailing_stop:
      enabled: false
      distance: 0.03
      action: close
  portfolio_exits:
    stop_loss: null
    take_profit: null
    max_drawdown: null
  cooldown_bars: 1
  reentry_policy: next_scheduled_rebalance
  max_triggers_per_symbol: null

output:
  root: data/backtest/runs
  save_factor_values: true
  save_universe: true
  save_positions: true
  save_trades: true
  save_costs: true
  render_html: true

performance:
  mode: in_memory
  chunk_interval: 2d
  max_input_rows_per_chunk: 5000000
  max_incremental_rss_mib: 1024
  # 改为 mode: chunked 时本字段必须显式填写。
  # 当前服务器可用 5632；整机只有 6 GiB 时建议使用 5120。
  max_process_rss_mib: null
  resume_policy: resume
  collect_diagnostics: true
  max_rank_lag: 24
  max_rank_state_rows: 20000
  max_position_state_rows: 20000
  max_pending_instructions: 20000
  max_risk_state_rows: 20000
  max_pending_risk_intents: 20000
